name: "Prosody XMPP Server"
description: "Lightweight XMPP server powered by Prosody"
version: "69.69.69"
slug: "prosody"
init: false
arch:
  - aarch64
  - amd64
  - armv7
ports:
  5222/tcp: 5222
  5269/tcp: 5269
  5280/tcp: 5280
options:
  domain: "xmpp.example.com"
  admin_user: "admin"
  admin_password: "changeme"
schema:
  domain: str
  admin_user: str
  admin_password: str
map:
  - data:rw
